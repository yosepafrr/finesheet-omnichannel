[program:finesheet-queue-fulfillment]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/finesheet/artisan queue:work --queue=fulfillment --sleep=1 --timeout=180 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/finesheet/storage/logs/queue-fulfillment-%(process_num)02d.log
stopwaitsecs=240
